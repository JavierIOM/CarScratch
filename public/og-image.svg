<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.4"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left amber accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#f59e0b"/>

  <!-- Top amber line -->
  <rect x="6" y="0" width="1194" height="3" fill="#f59e0b" opacity="0.3"/>

  <!-- Registration plate graphic -->
  <g transform="translate(88, 200)">
    <!-- Plate background -->
    <rect width="260" height="70" rx="6" fill="#ffdd00"/>
    <!-- GB badge -->
    <rect width="44" height="70" rx="6" fill="#003399"/>
    <rect x="38" width="6" height="70" fill="#003399"/>
    <text x="22" y="26" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">GB</text>
    <circle cx="22" cy="42" r="10" fill="none" stroke="white" stroke-width="1.5"/>
    <text x="22" y="46" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">★</text>
    <!-- Plate text -->
    <text x="158" y="50" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#1a1a1a" text-anchor="middle" letter-spacing="3">AB12 CDE</text>
  </g>

  <!-- IoM plate graphic -->
  <g transform="translate(88, 295)">
    <!-- Plate background -->
    <rect width="220" height="70" rx="6" fill="#ffdd00"/>
    <!-- M badge -->
    <rect width="44" height="70" rx="6" fill="#dc2626"/>
    <rect x="38" width="6" height="70" fill="#dc2626"/>
    <text x="22" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">M</text>
    <!-- Plate text -->
    <text x="138" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1a1a1a" text-anchor="middle" letter-spacing="2">PMN 147</text>
  </g>

  <!-- Main title -->
  <text x="680" y="220" font-family="Arial, sans-serif" font-size="88" font-weight="bold" fill="#f1f5f9" text-anchor="middle">CarScratch</text>

  <!-- Amber underline -->
  <rect x="430" y="238" width="500" height="4" fill="url(#amber-glow)" rx="2"/>

  <!-- Tagline -->
  <text x="680" y="300" font-family="Arial, sans-serif" font-size="30" fill="#94a3b8" text-anchor="middle">UK &amp; Isle of Man Vehicle Information</text>

  <!-- Feature pills -->
  <g transform="translate(400, 340)">
    <rect width="140" height="34" rx="17" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="23" font-family="Arial, sans-serif" font-size="15" fill="#93c5fd" text-anchor="middle">MOT History</text>
  </g>
  <g transform="translate(556, 340)">
    <rect width="130" height="34" rx="17" fill="#1e3a2f" stroke="#22c55e" stroke-width="1.5"/>
    <text x="65" y="23" font-family="Arial, sans-serif" font-size="15" fill="#86efac" text-anchor="middle">Tax Status</text>
  </g>
  <g transform="translate(702, 340)">
    <rect width="130" height="34" rx="17" fill="#3b1f00" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="65" y="23" font-family="Arial, sans-serif" font-size="15" fill="#fcd34d" text-anchor="middle">Mileage</text>
  </g>
  <g transform="translate(848, 340)">
    <rect width="110" height="34" rx="17" fill="#2d1f3d" stroke="#a855f7" stroke-width="1.5"/>
    <text x="55" y="23" font-family="Arial, sans-serif" font-size="15" fill="#d8b4fe" text-anchor="middle">ULEZ</text>
  </g>

  <!-- Description -->
  <text x="680" y="430" font-family="Arial, sans-serif" font-size="22" fill="#64748b" text-anchor="middle">Free vehicle lookup — no sign-up required</text>

  <!-- URL bar -->
  <rect x="440" y="455" width="480" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="680" y="484" font-family="Arial, sans-serif" font-size="20" fill="#f59e0b" text-anchor="middle" font-weight="bold">carscratch.uk</text>
</svg>
