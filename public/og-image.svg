<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.4"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left amber accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#f59e0b"/>

  <!-- Top amber line -->
  <rect x="6" y="0" width="1194" height="3" fill="#f59e0b" opacity="0.3"/>

  <!-- Main title -->
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#f1f5f9" text-anchor="middle">CarScratch</text>

  <!-- Amber underline -->
  <rect x="330" y="250" width="540" height="4" fill="url(#amber-glow)" rx="2"/>

  <!-- Tagline -->
  <text x="600" y="315" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle">UK &amp; Isle of Man Vehicle Information</text>

  <!-- Feature pills -->
  <g transform="translate(310, 365)">
    <rect width="140" height="36" rx="18" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="24" font-family="Arial, sans-serif" font-size="16" fill="#93c5fd" text-anchor="middle">MOT History</text>
  </g>
  <g transform="translate(466, 365)">
    <rect width="130" height="36" rx="18" fill="#1e3a2f" stroke="#22c55e" stroke-width="1.5"/>
    <text x="65" y="24" font-family="Arial, sans-serif" font-size="16" fill="#86efac" text-anchor="middle">Tax Status</text>
  </g>
  <g transform="translate(612, 365)">
    <rect width="130" height="36" rx="18" fill="#3b1f00" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="65" y="24" font-family="Arial, sans-serif" font-size="16" fill="#fcd34d" text-anchor="middle">Mileage</text>
  </g>
  <g transform="translate(758, 365)">
    <rect width="130" height="36" rx="18" fill="#2d1f3d" stroke="#a855f7" stroke-width="1.5"/>
    <text x="65" y="24" font-family="Arial, sans-serif" font-size="16" fill="#d8b4fe" text-anchor="middle">ULEZ Check</text>
  </g>

  <!-- Description -->
  <text x="600" y="455" font-family="Arial, sans-serif" font-size="22" fill="#64748b" text-anchor="middle">Free vehicle lookup — no sign-up required</text>

  <!-- URL bar -->
  <rect x="360" y="478" width="480" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="509" font-family="Arial, sans-serif" font-size="22" fill="#f59e0b" text-anchor="middle" font-weight="bold">carscratch.uk</text>
</svg>
